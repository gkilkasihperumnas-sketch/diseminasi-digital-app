<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Diseminasi Digital - Kementerian Pertanian</title>

  <meta
    name="description"
    content="Diseminasi Digital - Kementerian Pertanian"
  >

  <meta name="theme-color" content="#0b6b3a">

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html,
    body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      font-family: Arial, Helvetica, sans-serif;
      background: #f5f7f6;
    }

    .app-container {
      width: 100%;
      height: 100vh;
      position: relative;
      background: #ffffff;
    }

    iframe {
      display: block;
      width: 100%;
      height: 100%;
      border: 0;
      background: #ffffff;
    }

    /* Loading */
    .loading {
      position: absolute;
      inset: 0;
      z-index: 10;

      display: flex;
      align-items: center;
      justify-content: center;
      flex-direction: column;

      background: #ffffff;
      color: #333333;
    }

    .spinner {
      width: 42px;
      height: 42px;
      margin-bottom: 15px;

      border: 4px solid #e0e0e0;
      border-top-color: #0b6b3a;
      border-radius: 50%;

      animation: spin 0.8s linear infinite;
    }

    .loading-title {
      font-size: 17px;
      font-weight: 600;
      margin-bottom: 6px;
    }

    .loading-text {
      font-size: 13px;
      color: #777777;
    }

    @keyframes spin {
      from {
        transform: rotate(0deg);
      }

      to {
        transform: rotate(360deg);
      }
    }

    /* Error */
    .error {
      display: none;

      position: absolute;
      inset: 0;
      z-index: 20;

      align-items: center;
      justify-content: center;
      flex-direction: column;

      padding: 30px;
      text-align: center;

      background: #ffffff;
    }

    .error h2 {
      margin-bottom: 10px;
      color: #c62828;
    }

    .error p {
      max-width: 500px;
      line-height: 1.6;
      color: #555555;
    }

    .retry {
      margin-top: 20px;

      padding: 11px 22px;

      border: 0;
      border-radius: 8px;

      background: #0b6b3a;
      color: #ffffff;

      cursor: pointer;
      font-size: 14px;
    }

    .retry:hover {
      background: #09582f;
    }
  </style>
</head>

<body>

  <div class="app-container">

    <!-- Loading -->
    <div class="loading" id="loading">

      <div class="spinner"></div>

      <div class="loading-title">
        Diseminasi Digital
      </div>

      <div class="loading-text">
        Memuat aplikasi...
      </div>

    </div>


    <!-- Aplikasi Google Apps Script -->
    <iframe
      id="appFrame"
      src="https://script.google.com/macros/s/AKfycbxb3m6_1g5NMAOOBzdrosV5gGe5tU9meok7jfEyNZ1L7BxUu5T5_HXu5zHS8DlrOFVNiQ/exec"
      allow="clipboard-read; clipboard-write"
      allowfullscreen>
    </iframe>


    <!-- Error -->
    <div class="error" id="error">

      <h2>Aplikasi tidak dapat dimuat</h2>

      <p>
        Silakan periksa koneksi internet Anda atau buka kembali
        aplikasi beberapa saat lagi.
      </p>

      <button
        class="retry"
        type="button"
        onclick="reloadApp()">
        Muat Ulang
      </button>

    </div>

  </div>


  <script>
    const frame = document.getElementById("appFrame");
    const loading = document.getElementById("loading");
    const error = document.getElementById("error");

    let loaded = false;
    let errorTimer;


    /*
     * Ketika Google Apps Script selesai dimuat
     */
    frame.addEventListener("load", function () {

      loaded = true;

      clearTimeout(errorTimer);

      setTimeout(function () {
        loading.style.display = "none";
      }, 500);

    });


    /*
     * Fungsi Muat Ulang
     */
    function reloadApp() {

      loaded = false;

      error.style.display = "none";
      loading.style.display = "flex";

      frame.src =
        "https://script.google.com/macros/s/AKfycbxb3m6_1g5NMAOOBzdrosV5gGe5tU9meok7jfEyNZ1L7BxUu5T5_HXu5zHS8DlrOFVNiQ/exec?reload=" +
        Date.now();

      startErrorTimer();
    }


    /*
     * Jika aplikasi tidak berhasil dimuat
     * dalam 15 detik, tampilkan halaman error.
     */
    function startErrorTimer() {

      clearTimeout(errorTimer);

      errorTimer = setTimeout(function () {

        if (!loaded) {

          loading.style.display = "none";
          error.style.display = "flex";

        }

      }, 15000);
    }


    /*
     * Jalankan timer ketika halaman pertama kali dibuka.
     */
    startErrorTimer();

  </script>

</body>
</html>
